name: holoscoop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: holoscoop:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "${MSSQL_CONNECTION_STRING:?Set MSSQL_CONNECTION_STRING in .env}"
      Redis__ConnectionString: "${REDIS_CONNECTION_STRING:?Set REDIS_CONNECTION_STRING in .env}"
      Redis__StreamName: "${REDIS_STREAM_NAME:-holoscoop:tasks}"
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__MasterKey: "${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}"
      Media__LibraryPath: "/data/library"
      Media__WorkPath: "/data/work"
    volumes:
      - library_data:/data/library
      - work_data:/data/work
    depends_on:
      meilisearch:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.37
    restart: unless-stopped
    environment:
      MEILI_ENV: "production"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}"
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  library_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.16.1.101,rw,nfsvers=3"
      device: ":/volume1/media/Video/Hololive"
  work_data:
  meilisearch_data:
